<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Clínica Salud Vida – Prototipo académico</title>
    <style>
      /* CSS */
      /* VARIABLES DE COLOR */
      :root {
        --bg: #f3f8f7;
        --ink: #16323a;
        --mut: #5b7480;
        --pri: #0f766e;
        --soft: #e0f2ef;
        --bd: #d3e2e4;
        --ok: #15803d;
        --er: #b91c1c;
        --wa: #b45309;
        --card: #fff;
        --bd2: #b9cdd1;
      }
      html {
        font-size: var(--fs, 15px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--ff, "Segoe UI", system-ui, sans-serif);
        font-size: 1rem;
        line-height: 1.45;
        background: var(--bg);
        color: var(--ink);
      }
      /* ESTRUCTURA Y MENU LATERAL */
      .app {
        display: flex;
        min-height: 100vh;
      }
      aside {
        width: 250px;
        background: var(--card);
        border-right: 1px solid var(--bd);
        padding: 18px 12px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
        flex-shrink: 0;
      }
      .brand {
        font-weight: 700;
        font-size: 1.2rem;
        color: var(--pri);
        padding: 0 8px 4px;
      }
      .who {
        font-size: 0.867rem;
        color: var(--mut);
        padding: 0 8px 12px;
        border-bottom: 1px solid var(--bd);
        margin-bottom: 8px;
      }
      .sec {
        font-size: 0.733rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--mut);
        margin: 14px 8px 4px;
      }
      aside a {
        display: block;
        padding: 8px 10px;
        border-radius: 8px;
        color: var(--ink);
        text-decoration: none;
        cursor: pointer;
      }
      aside a:hover {
        background: var(--soft);
      }
      aside a.on {
        background: var(--pri);
        color: #fff;
      }
      /* CONTENIDO PRINCIPAL */
      main {
        flex: 1;
        padding: 24px 28px 90px;
        max-width: 1100px;
        min-width: 0;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.6rem;
      }
      h2 {
        font-size: 1.133rem;
        margin: 0 0 10px;
      }
      .sub {
        color: var(--mut);
        margin: 0 0 18px;
      }
      /* TARJETAS Y TABLAS */
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.933rem;
      }
      th {
        text-align: left;
        color: var(--mut);
        font-weight: 600;
        border-bottom: 2px solid var(--bd);
        padding: 7px 8px;
      }
      td {
        padding: 8px;
        border-bottom: 1px solid var(--bd);
        vertical-align: middle;
      }
      .tw {
        overflow-x: auto;
      }
      /* FORMULARIOS Y BOTONES */
      form.g {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        align-items: end;
      }
      label {
        display: block;
        font-size: 0.867rem;
        font-weight: 600;
        color: var(--mut);
      }
      label b {
        color: var(--er);
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--bd2);
        border-radius: 8px;
        font: inherit;
        background: var(--card);
        color: var(--ink);
        margin-top: 3px;
      }
      textarea {
        min-height: 70px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid #5eead4;
        border-color: var(--pri);
      }
      button,
      .btn {
        background: var(--pri);
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 8px 14px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.1);
      }
      button.s {
        background: var(--card);
        color: var(--pri);
        border: 1px solid var(--pri);
      }
      button.d {
        background: var(--er);
      }
      button.sm {
        padding: 4px 10px;
        font-size: 0.867rem;
      }
      /* ETIQUETAS DE ESTADO */
      .bd {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 99px;
        font-size: 0.8rem;
        font-weight: 600;
        background: #e5eef0;
        color: #37505a;
      }
      .bd.ok {
        background: #dcfce7;
        color: var(--ok);
      }
      .bd.wa {
        background: #fef3c7;
        color: var(--wa);
      }
      .bd.er {
        background: #fee2e2;
        color: var(--er);
      }
      .bd.in {
        background: #dbeafe;
        color: #1d4ed8;
      }
      /* MENSAJES Y VENTANA EMERGENTE */
      #toast {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 99;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .t {
        padding: 10px 14px;
        border-radius: 8px;
        color: #fff;
        box-shadow: 0 4px 14px #0003;
        max-width: 360px;
      }
      .t.ok {
        background: var(--ok);
      }
      .t.err {
        background: var(--er);
      }
      #modal {
        position: fixed;
        inset: 0;
        background: #0008;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 14px;
      }
      #modal.on {
        display: flex;
      }
      .paper {
        background: var(--card);
        border-radius: 10px;
        padding: 26px;
        width: min(460px, 100%);
        max-height: 92vh;
        overflow: auto;
      }
      .paper h3 {
        margin: 0 0 2px;
        color: var(--pri);
      }
      .paper pre {
        white-space: pre-wrap;
        font: inherit;
        background: var(--soft);
        padding: 10px;
        border-radius: 8px;
      }
      /* LOGIN, INICIO Y UTILIDADES */
      .login {
        max-width: 520px;
        margin: 40px auto;
        padding: 0 14px;
      }
      .mut {
        color: var(--mut);
        font-size: 0.867rem;
      }
      .kpi {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
      }
      .kpi div {
        background: var(--soft);
        border-radius: 10px;
        padding: 12px;
      }
      .kpi b {
        font-size: 1.467rem;
        display: block;
        color: var(--pri);
      }
      .low {
        color: var(--er);
        font-weight: 700;
      }
      /* VENTANA DE REQUISITOS */
      details.card summary {
        cursor: pointer;
        font-weight: 600;
        color: var(--pri);
      }
      details.card[open] summary {
        margin-bottom: 8px;
      }
      details.card li {
        margin: 3px 0;
      }

      /* TEMAS, APARIENCIA Y AYUDA */
      main a {
        color: var(--pri);
      }
      :root[data-tema="oscuro"] {
        --bg: #0f1b1f;
        --ink: #e6f1f2;
        --mut: #9fb6bd;
        --pri: #0d9488;
        --soft: #1b3a40;
        --bd: #2b4249;
        --bd2: #3b5a63;
        --card: #16262b;
        --ok: #4ade80;
        --er: #f87171;
        --wa: #fbbf24;
      }
      :root[data-tema="contraste"] {
        --bg: #ffffff;
        --ink: #000000;
        --mut: #222222;
        --pri: #00467f;
        --soft: #e8e8e8;
        --bd: #000000;
        --bd2: #000000;
        --card: #ffffff;
        --ok: #006400;
        --er: #a00000;
        --wa: #7a3b00;
      }
      :root[data-tema="calido"] {
        --bg: #f6f0e4;
        --ink: #3b2f2f;
        --mut: #6f5f55;
        --pri: #8a5a2b;
        --soft: #efe3cf;
        --bd: #dccbb0;
        --bd2: #c9b390;
        --card: #fffaf0;
      }
      #fab {
        position: fixed;
        right: 14px;
        bottom: 14px;
        z-index: 40;
        display: flex;
        gap: 8px;
      }
      #fab button {
        border-radius: 99px;
        box-shadow: 0 4px 14px #0004;
        padding: 10px 16px;
      }
      #bot {
        position: fixed;
        right: 14px;
        bottom: 66px;
        width: min(380px, calc(100vw - 28px));
        height: min(540px, 72vh);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 14px;
        box-shadow: 0 10px 30px #0005;
        display: none;
        flex-direction: column;
        z-index: 45;
      }
      #bot.on {
        display: flex;
      }
      .bh {
        padding: 10px 14px;
        background: var(--pri);
        color: #fff;
        border-radius: 13px 13px 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
      }
      .bh button {
        background: transparent;
        padding: 2px 8px;
      }
      .bm {
        flex: 1;
        overflow: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .mg {
        max-width: 90%;
        padding: 8px 11px;
        border-radius: 12px;
        background: var(--soft);
      }
      .mg.u {
        align-self: flex-end;
        background: var(--pri);
        color: #fff;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 0 10px 8px;
        max-height: 120px;
        overflow: auto;
      }
      .bi {
        display: flex;
        gap: 6px;
        padding: 8px;
        border-top: 1px solid var(--bd);
      }
      .bi input {
        margin: 0;
      }
      .sw {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid var(--bd2);
        padding: 0;
      }

      /* ADAPTACION A PANTALLAS PEQUENAS */
      @media (max-width: 760px) {
        .app {
          flex-direction: column;
        }
        aside {
          width: 100%;
          height: auto;
          position: static;
        }
        main {
          padding: 16px;
        }
      }
      /* IMPRESION DE COMPROBANTES Y DOCUMENTOS */
      @media print {
        body > *:not(#modal) {
          display: none !important;
        }
        #modal {
          position: static;
          background: none;
          display: block;
        }
        .paper {
          box-shadow: none;
          max-height: none;
        }
        .noprint {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal"></div>
    <div id="toast"></div>
    <div id="bot">
      <div class="bh">
        <span>Asistente de ayuda</span>
        <button type="button" onclick="toggleBot()" aria-label="Cerrar ayuda">✕</button>
      </div>
      <div class="bm" id="bm"></div>
      <div class="chips" id="bc"></div>
      <form class="bi" onsubmit="askF(event)">
        <input id="bq" placeholder="Escriba su pregunta…" autocomplete="off" />
        <button>Enviar</button>
      </form>
    </div>
    <div id="fab">
      <button type="button" onclick="toggleBot()">Ayuda</button>
      <button type="button" class="s" onclick="openCfg()">Apariencia</button>
    </div>
    <script>
      /* JS */
      /* DATOS INICIALES Y CONFIGURACION */
      const K = "csv_db_v1",
        HORAS = ["08:00", "09:00", "10:00", "11:00", "15:00", "16:00"],
        PRECIO = { Inicial: 80, Control: 50 };
      const USERS = [
        { u: "recepcion", p: "rec123", r: "Recepcionista", n: "Yorvy Morales" },
        { u: "cajero", p: "caj123", r: "Cajero", n: "Michel Lobato" },
        { u: "enfermero", p: "enf123", r: "Enfermero", n: "Patrick Silva" },
        {
          u: "medico",
          p: "med123",
          r: "Médico",
          n: "Dr. Jose Vigo",
          did: 1,
          t: "Jefe de médicos",
          jefe: true,
        },
        { u: "farmacia", p: "far123", r: "Farmacéutico", n: "Jhair Cholan" },
        { u: "admin", p: "adm123", r: "Administrador", n: "Ing. Florian" },
      ];
      const SEC = [
        "Seguridad",
        "Pacientes y citas",
        "Caja",
        "Atención médica",
        "Farmacia y reposición",
      ];
      const MENU = {
        Recepcionista: [
          ["ini", "Inicio", 0],
          ["pac", "Pacientes", 1],
          ["cit", "Citas", 1],
          ["conf", "Confirmar citas", 1],
          ["res", "Resultados externos", 1],
        ],
        Cajero: [
          ["ini", "Inicio", 0],
          ["pag", "Registrar pagos", 2],
          ["med", "Consultar medicamentos", 4],
        ],
        Enfermero: [
          ["ini", "Inicio", 0],
          ["pre", "Preconsulta", 3],
        ],
        Médico: [
          ["ini", "Inicio", 0],
          ["aten", "Atención", 3],
          ["hist", "Historia clínica", 3],
          ["med", "Consultar medicamentos", 4],
        ],
        Farmacéutico: [
          ["ini", "Inicio", 0],
          ["med", "Consultar medicamentos", 4],
          ["ord", "Órdenes y entrega", 4],
          ["rsol", "Solicitar reposición", 4],
          ["rrec", "Registrar recepción", 4],
        ],
        Administrador: [
          ["ini", "Inicio", 0],
          ["rrev", "Revisar reposiciones", 4],
          ["med", "Consultar medicamentos", 4],
        ],
      };
      const seed = () => ({
        n: 100,
        pac: [
          { id: 1, dni: "45871236", nom: "Skibidi Alex Ruiz", fn: "1988-04-12", tel: "987654321" },
          { id: 2, dni: "70231458", nom: "Fernando Dog SMG", fn: "1975-09-30", tel: "965412378" },
          {
            id: 3,
            dni: "41236987",
            nom: "Daivis Tturcoño Masias",
            fn: "2015-01-20",
            tel: "944123654",
          },
        ],
        doc: [
          { id: 1, nom: "Dra. Alexandra Antonella Parrilla Velasquez", esp: "Medicina general" },
          { id: 2, nom: "Dr. Jorge Emilio De la Cruz Medina", esp: "Pediatría" },
          { id: 3, nom: "Dra. Sexther Diaz Gonzales", esp: "Ginecología" },
        ],
        med: [
          [1, "Paracetamol 500 mg", 0.5, 200, 0.3],
          [2, "Ibuprofeno 400 mg", 0.8, 120, 0.5],
          [3, "Amoxicilina 500 mg", 1.5, 60, 1],
          [4, "Loratadina 10 mg", 0.7, 80, 0.4],
          [5, "Omeprazol 20 mg", 0.9, 5, 0.55],
          [6, "Cloroformo", 18, 3, 11],
          [7, "Suero oral", 2.5, 40, 1.6],
          [8, "Diclofenaco 50 mg", 0.6, 90, 0.35],
        ].map((m) => ({ id: m[0], nom: m[1], pr: m[2], st: m[3], pc: m[4] })),
        cit: [],
        pag: [],
        pre: [],
        ate: [],
        dcs: [],
        res: [],
        ord: [],
        rep: [],
      });
      /* BASE DE DATOS LOCAL Y SESION */
      let D;
      try {
        D = JSON.parse(localStorage.getItem(K));
      } catch (e) {}
      D = D || seed();
      D.med.forEach((m) => {
        if (m.pc == null) {
          const s0 = seed().med.find((x) => x.id == m.id);
          m.pc = s0 ? s0.pc : +(m.pr * 0.65).toFixed(2);
        }
      });
      let U = null,
        V = "ini",
        ST = {};
      try {
        U = JSON.parse(sessionStorage.getItem("csv_u"));
      } catch (e) {}
      /* FUNCIONES AUXILIARES */
      const $ = (id) => document.getElementById(id),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
          );
      const save = () => {
          try {
            localStorage.setItem(K, JSON.stringify(D));
          } catch (e) {
            toast("No se pudo guardar en el navegador", "err");
          }
        },
        nid = () => ++D.n;
      const toast = (m, t = "ok") => {
        const e = document.createElement("div");
        e.className = "t " + t;
        e.textContent = m;
        $("toast").append(e);
        setTimeout(() => e.remove(), 4200);
      };
      const S = (n) => "S/ " + Number(n).toFixed(2),
        today = () => new Date().toISOString().slice(0, 10);
      const pac = (id) => D.pac.find((p) => p.id == id) || {},
        doc = (id) => D.doc.find((d) => d.id == id) || {},
        med = (id) => D.med.find((m) => m.id == id) || {};
      const citPaid = (c) => D.pag.some((p) => p.t == "cita" && p.ref == c.id);
      const B = (t, k = "") => `<span class="bd ${k}">${esc(t)}</span>`;
      const K_ES = {
        Programada: "wa",
        Confirmada: "in",
        Preconsulta: "in",
        Atendida: "ok",
        Preparada: "wa",
        Pagada: "in",
        Entregada: "ok",
        Pendiente: "wa",
        Aprobada: "in",
        Rechazada: "er",
        Recibida: "ok",
      };
      const eb = (e) => B(e, K_ES[e]);
      const T = (h, r, e = "Sin registros.") =>
        `<div class="tw"><table><tr>${h.map((x) => `<th>${x}</th>`).join("")}</tr>${r.length ? r.map((x) => `<tr>${x.map((y) => `<td>${y}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${h.length}" class="mut">${e}</td></tr>`}</table></div>`;
      const F = (l, i, r = 1) => `<div><label>${l}${r ? " <b>*</b>" : ""}${i}</label></div>`;
      const opts = (a, f, sel) =>
        a
          .map(
            (x) => `<option value="${x.id}" ${x.id == sel ? "selected" : ""}>${esc(f(x))}</option>`,
          )
          .join("");
      const fd = (e) => {
        e.preventDefault();
        return Object.fromEntries(new FormData(e.target));
      };
      const cname = (c) =>
        `${esc(pac(c.pid).nom)} · ${esc(doc(c.did).nom)} · ${c.fecha} ${c.hora} (${c.tipo})`;
      const libres = (did, f) =>
        HORAS.filter((h) => !D.cit.some((c) => c.did == did && c.fecha == f && c.hora == h));
      const go = (v) => {
        V = v;
        ST = {};
        render();
      };
      function show(html) {
        $("modal").innerHTML =
          `<div class="paper">${html}<p class="noprint" style="margin-top:14px;text-align:right"><button onclick="window.print()">Imprimir</button> <button class="s" onclick="closeM()">Cerrar</button></p></div>`;
        $("modal").classList.add("on");
      }
      const closeM = () => $("modal").classList.remove("on");
      const head = (s) => `<h3>Clínica Salud Vida</h3><div class="mut">${s}</div><hr>`;

      /* PANTALLAS DE CADA MODULO */
      const VW = {
        ini() {
          const q = D;
          return `<div class="card"><h2>Bienvenido/a, ${esc(U.n)}</h2><p class="mut">Rol: ${U.t || U.r}. Solo se muestran los módulos de su rol (simulación académica, sin seguridad real).</p><div class="kpi"><div><b>${q.pac.length}</b>Pacientes</div><div><b>${q.cit.filter((c) => c.estado == "Programada").length}</b>Citas programadas</div><div><b>${q.ord.filter((o) => o.estado != "Entregada").length}</b>Órdenes abiertas</div><div><b>${q.rep.filter((r) => r.estado == "Pendiente").length}</b>Reposiciones pendientes</div></div></div>`;
        },
        pac() {
          const q = (ST.q || "").toLowerCase(),
            e = D.pac.find((p) => p.id == ST.ed) || {};
          return `<div class="card"><h2>${e.id ? "Actualizar" : "Registrar"} paciente</h2><form class="g" onsubmit="A.pac(event)"><input type="hidden" name="id" value="${e.id || ""}">
${F("DNI (8 dígitos)", `<input name="dni" required pattern="[0-9]{8}" value="${esc(e.dni)}">`)}${F("Nombre completo", `<input name="nom" required value="${esc(e.nom)}">`)}${F("Fecha de nacimiento", `<input type="date" name="fn" required max="${today()}" value="${e.fn || ""}">`)}${F("Teléfono", `<input name="tel" required pattern="[0-9]{7,9}" value="${esc(e.tel)}">`)}
<div><button>${e.id ? "Guardar cambios" : "Registrar"}</button> ${e.id ? `<button type="button" class="s" onclick="ST.ed=0;render()">Cancelar</button>` : ""}</div></form></div>
<div class="card"><h2>Buscar pacientes</h2><input placeholder="DNI o nombre…" value="${esc(ST.q)}" oninput="ST.q=this.value;rr('lp')">
<div id="lp">${LP()}</div></div>`;
        },
        cit() {
          const did = ST.did || D.doc[0].id,
            f = ST.f || today();
          return `<div class="card"><h2>Programar cita</h2><form class="g" onsubmit="A.cit(event)">
${F("Paciente", `<select name="pid" required><option value="">Seleccione…</option>${opts(D.pac, (p) => p.dni + " – " + p.nom)}</select>`)}
${F("Médico", `<select name="did" onchange="ST.did=this.value;ST.f=this.form.f.value;render()">${opts(D.doc, (d) => d.nom + " (" + d.esp + ")", did)}</select>`)}
${F("Fecha", `<input type="date" name="f" min="${today()}" required value="${f}" onchange="ST.f=this.value;ST.did=this.form.did.value;render()">`)}
${F(
  "Horario disponible",
  `<select name="h" required>${
    libres(did, f)

    <p><b>Reglas</b></p><ul>${r[7].map((x) => `<li>${x}</li>`).join("")}</ul></details>`,
        ).join("");

      /* VALIDACION DE RUC */
      const rucOk = (r) => {
        if (!/^(10|15|16|17|20)[0-9]{9}$/.test(r)) return false;
        const w = [5, 4, 3, 2, 7, 6, 5, 4, 3, 2],
          t = w.reduce((a, x, i) => a + x * +r[i], 0);
        return (11 - (t % 11)) % 10 == +r[10];
      };

      /* PRECIOS DE COMPRA */
      const VERC = () => U && (U.r == "Farmacéutico" || U.r == "Administrador");
      const pcOf = (i) => i.pc ?? med(i.m).pc ?? 0;
      const RL = (r) =>
        r.it.map((i) => `${i.c}× ${esc(med(i.m).nom)} · ${S(pcOf(i))} c/u`).join("<br>");
      const RTOT = (r) => r.it.reduce((t, i) => t + i.c * pcOf(i), 0);
      const rsTot = () => {
        let t = 0;
        D.med.forEach((m) => {
          const i = document.querySelector(`[name=m${m.id}]`);
          t += (+(i && i.value) || 0) * m.pc;
        });
        $("rst").textContent = S(t);
      };

      /* TABLAS REUTILIZABLES */
      const SUP = () =>
        U.jefe
          ? `<div class="card"><h2>Supervisión de médicos</h2><p class="mut">Como jefe de médicos puede ver la carga de cada médico y atender cualquier cita en espera.</p>${T(
              ["Médico", "Especialidad", "Programadas", "Confirmadas", "En espera", "Atendidas"],
              D.doc.map((d) => {
                const n = (e) => D.cit.filter((c) => c.did == d.id && c.estado == e).length;
                return [
                  esc(d.nom),
                  esc(d.esp),
                  n("Programada"),
                  n("Confirmada"),
                  n("Preconsulta"),
                  n("Atendida"),
                ];
              }),
            )}</div>`
          : "";
      const RT = () =>
        T(
          ["N°", "Detalle", "Total", "Estado", "Proveedor", "Recepción"],
          D.rep.map((r) => [
            "#" + r.id,
            RL(r),
            S(RTOT(r)),
            eb(r.estado),
            r.prov ? esc(r.prov) + '<br><span class="mut">RUC ' + esc(r.ruc) + "</span>" : "–",
            r.rec
              ? r.rec.map((x) => `${esc(med(x.m).nom)}: rec. ${x.r}, acept. ${x.a}`).join("<br>") +
                (r.ob ? "<br><i>" + esc(r.ob) + "</i>" : "")
              : "–",
          ]),
        );
      const LP = () => {
        const q = (ST.q || "").toLowerCase();
        return T(
          ["DNI", "Nombre", "Nacimiento", "Teléfono", ""],
          D.pac
            .filter((p) => (p.dni + p.nom).toLowerCase().includes(q))
            .map((p) => [
              p.dni,
              esc(p.nom),
              p.fn,
              p.tel,
              `<button class="sm s" onclick="ST.ed=${p.id};render();scrollTo(0,0)">Editar</button>`,
            ]),
        );
      };
      const LM = () => {
        const q = (ST.q || "").toLowerCase(),
          v = VERC();
        return T(
          [
            "Medicamento",
            v ? "Precio de venta" : "Precio",
            ...(v ? ["Precio de compra (fijo)"] : []),
            "Stock",
          ],
          D.med
            .filter((m) => m.nom.toLowerCase().includes(q))
            .map((m) => [
              esc(m.nom),
              S(m.pr),
              ...(v ? [S(m.pc)] : []),
              m.st <= 10 ? `<span class="low">${m.st} (bajo)</span>` : m.st,
            ]),
        );
      };
      const rr = (id) => {
        $(id).innerHTML = id == "lp" ? LP() : LM();
      };
      const HIST = (pid) => {
        const a = D.ate.filter((x) => x.pid == pid).reverse(),
          r = D.res.filter((x) => x.pid == pid);
        return (
          `<b>${esc(pac(pid).nom)}</b>` +
          (a.length
            ? a
                .map(
                  (x) =>
                    `<div class="card" style="margin:8px 0"><b>${x.f}</b> · ${esc(doc(x.did).nom)} · ${x.tipo}<br>Motivo: ${esc(x.mo)}<br>Diagnóstico: ${esc(x.dx)}<br>Indicaciones: ${esc(x.ind)}<br>${D.dcs
                      .filter((d) => d.cid == x.cid)
                      .map(
                        (d) => `<button class="sm s" onclick="A.vdoc(${d.id})">${d.tipo}</button>`,
                      )
                      .join(" ")}</div>`,
                )
                .join("")
            : '<p class="mut">Sin atenciones previas.</p>') +
          `<h2>Resultados externos</h2>` +
          (r.length
            ? r
                .map(
                  (x) =>
                    `<div>${esc(x.nom)} (${x.f}) – <a href="${x.data}" download="${esc(x.fn)}">${esc(x.fn)}</a></div>`,
                )
                .join("")
            : '<p class="mut">Sin resultados registrados.</p>')
        );
      };

      /* ACCIONES Y REGLAS DE NEGOCIO */
      const A = {
        login(e) {
          const d = fd(e),
            u = USERS.find((x) => x.u == d.u.trim() && x.p == d.p);
          if (!u) return toast("Usuario o contraseña incorrectos", "err");
          U = u;
          V = "ini";
          ST = {};
          sessionStorage.setItem("csv_u", JSON.stringify(u));
          render();
        },
        fill(u) {
          const x = USERS.find((y) => y.u == u);
          document.querySelector("input[name=u]").value = x.u;
          document.querySelector("input[name=p]").value = x.p;
          toast("Datos de " + x.r + " cargados. Pulse Iniciar sesión.");
        },
        logout() {
          U = null;
          sessionStorage.removeItem("csv_u");
          render();
        },
        reset() {
          if (confirm("¿Restablecer todos los datos de demostración?")) {
            D = seed();
            save();
            ST = {};
            render();
            toast("Datos restablecidos");
          }
        },
        pac(e) {
          const d = fd(e),
            dup = D.pac.find((p) => p.dni == d.dni && p.id != d.id);
          if (dup) return toast("Ya existe un paciente con ese DNI: " + dup.nom, "err");
          if (d.id) {
            Object.assign(pac(d.id), { dni: d.dni, nom: d.nom.trim(), fn: d.fn, tel: d.tel });
            toast("Paciente actualizado");
          } else {
            D.pac.push({ id: nid(), dni: d.dni, nom: d.nom.trim(), fn: d.fn, tel: d.tel });
            toast("Paciente registrado");
          }
          ST.ed = 0;
          save();
          render();
        },
        cit(e) {
          const d = fd(e);
          if (!d.h) return toast("Seleccione un horario disponible", "err");
          if (D.cit.some((c) => c.did == d.did && c.fecha == d.f && c.hora == d.h))
            return toast("Ese médico ya tiene una cita en ese horario", "err");
          D.cit.push({
            id: nid(),
            pid: +d.pid,
            did: +d.did,
            fecha: d.f,
            hora: d.h,
            tipo: d.tipo,
            estado: "Programada",
          });
          save();
          toast("Cita programada. Pendiente de pago.");
          render();
        },
        pagar(t, id) {
          const c = t == "cita" ? D.cit.find((x) => x.id == id) : D.ord.find((x) => x.id == id);
          if (D.pag.some((p) => p.t == t && p.ref == id))
            return toast("Este concepto ya fue cobrado", "err");
          const met = $("m" + (t == "cita" ? "c" : "o") + id).value,
            monto = t == "cita" ? PRECIO[c.tipo] : c.total,
            p = {
              id: nid(),
              t,
              ref: id,
              pid: c.pid,
              monto,
              met,
              f: today(),
              con:
                t == "cita" ? "Consulta " + c.tipo.toLowerCase() : "Orden de medicamentos #" + id,
            };
          D.pag.push(p);
          if (t == "orden") c.estado = "Pagada";
          save();
          render();
          toast("Pago registrado");
          A.comp(p.id);
        },
        comp(id) {
          const p = D.pag.find((x) => x.id == id);
          show(
            head("Comprobante de pago simulado") +
              `<b>N° B001-${String(p.id).padStart(5, "0")}</b><br>Fecha: ${p.f}<br>Paciente: ${esc(pac(p.pid).nom)}<br>Concepto: ${esc(p.con)}<br>Método: ${p.met}<br><h2>Total: ${S(p.monto)}</h2><div class="mut">Documento académico sin valor tributario.</div>`,
          );
        },
        conf(id) {
          const c = D.cit.find((x) => x.id == id);
          if (!citPaid(c))
            return toast("No se puede confirmar: la cita no tiene pago registrado", "err");
          c.estado = "Confirmada";
          save();
          toast("Cita confirmada");
          render();
        },
        async res(e) {
          e.preventDefault();
          const d = new FormData(e.target),
            f = d.get("file");
          if (f.size > 307200) return toast("El archivo supera 300 KB", "err");
          const data = await new Promise((r) => {
            const x = new FileReader();
            x.onload = () => r(x.result);
            x.readAsDataURL(f);
          });
          D.res.push({
            id: nid(),
            pid: +d.get("pid"),
            nom: d.get("nom"),
            f: d.get("f"),
            fn: f.name,
            data,
          });
          save();
          toast("Resultado registrado");
          render();
        },
        pre(e) {
          const d = fd(e),
            c = D.cit.find((x) => x.id == d.cid);
          if (c.estado != "Confirmada") return toast("La cita no está confirmada", "err");
          D.pre.push({ cid: c.id, pa: d.pa, fc: d.fc, t: d.t, pe: d.pe, sp: d.sp, ob: d.ob });
          c.estado = "Preconsulta";
          save();
          toast("Preconsulta registrada");
          render();
        },
        ate(e) {
          const d = fd(e),
            c = D.cit.find((x) => x.id == d.cid);
          if (c.estado != "Preconsulta") return toast("La cita ya fue atendida", "err");
          D.ate.push({
            id: nid(),
            cid: c.id,
            pid: c.pid,
            did: c.did,
            tipo: c.tipo,
            f: today(),
            mo: d.mo,
            dx: d.dx,
            ind: d.ind,
          });
          c.estado = "Atendida";
          ST = {};
          save();
          toast("Atención guardada en la historia clínica");
          render();
        },
        dcs(e) {
          const d = fd(e);
          const x = { id: nid(), cid: +d.cid, tipo: d.tipo, c: d.c, f: today() };
          D.dcs.push(x);
          save();
          toast("Documento generado");
          render();
          A.vdoc(x.id);
        },
        vdoc(id) {
          const d = D.dcs.find((x) => x.id == id),
            c = D.cit.find((x) => x.id == d.cid);
          show(
            head(d.tipo) +
              `Fecha: ${d.f}<br>Paciente: ${esc(pac(c.pid).nom)}<br>Médico: ${esc(doc(c.did).nom)}<pre>${esc(d.c)}</pre>`,
          );
        },
        ord(e) {
          const d = fd(e),
            it = D.med.map((m) => ({ m: m.id, c: +d["m" + m.id] || 0 })).filter((i) => i.c > 0);
          if (!it.length) return toast("Agregue al menos un medicamento", "err");
          const bad = it.find((i) => i.c > med(i.m).st);
          if (bad)
            return toast(
              "Stock insuficiente de " + med(bad.m).nom + " (disponible: " + med(bad.m).st + ")",
              "err",
            );
          D.ord.push({
            id: nid(),
            pid: +d.pid,
            it,
            total: it.reduce((s, i) => s + i.c * med(i.m).pr, 0),
            estado: "Preparada",
          });
          save();
          toast("Orden preparada. Pendiente de pago en caja.");
          render();
        },
        ent(id) {
          const o = D.ord.find((x) => x.id == id);
          if (o.estado == "Entregada") return toast("La orden ya fue entregada", "err");
          if (o.estado != "Pagada" || !D.pag.some((p) => p.t == "orden" && p.ref == id))
            return toast("No se puede entregar: la orden no tiene pago registrado", "err");
          const bad = o.it.find((i) => i.c > med(i.m).st);
          if (bad) return toast("Stock insuficiente de " + med(bad.m).nom, "err");
          o.it.forEach((i) => (med(i.m).st -= i.c));
          o.estado = "Entregada";
          save();
          toast("Entrega registrada y stock actualizado");
          render();
        },
        rsol(e) {
          const d = fd(e),
            it = D.med
              .map((m) => ({ m: m.id, c: +d["m" + m.id] || 0, pc: m.pc }))
              .filter((i) => i.c > 0);
          if (!it.length) return toast("Seleccione al menos un medicamento", "err");
          D.rep.push({ id: nid(), it, estado: "Pendiente" });
          save();
          toast("Solicitud enviada al administrador");
          render();
        },
        rev(id, ok) {
          const r = D.rep.find((x) => x.id == id),
            pv = $("pv" + id).value.trim(),
            ruc = $("ruc" + id).value.trim();
          if (r.estado != "Pendiente") return;
          if (ok && !pv) return toast("Indique el proveedor para aprobar", "err");
          if (ok && !ruc)
            return toast("El proveedor debe tener RUC: ingréselo para aprobar", "err");
          if (ok && !rucOk(ruc))
            return toast(
              "RUC inválido: debe tener 11 dígitos, iniciar con 10, 15, 16, 17 o 20 y un dígito verificador correcto",
              "err",
            );
          r.estado = ok ? "Aprobada" : "Rechazada";
          if (ok) {
            r.prov = pv;
            r.ruc = ruc;
          }
          save();
          toast(ok ? "Solicitud aprobada" : "Solicitud rechazada");
          render();
        },
        rrec(e) {
          const d = fd(e),
            r = D.rep.find((x) => x.id == d.id);
          if (r.estado != "Aprobada") return toast("Esta recepción ya fue registrada", "err");
          const rec = r.it.map((i, k) => ({ m: i.m, s: i.c, r: +d["r" + k], a: +d["a" + k] }));
          if (rec.some((x) => x.a > x.r || x.r < 0 || x.a < 0))
            return toast("Las unidades aceptadas no pueden superar las recibidas", "err");
          rec.forEach((x) => (med(x.m).st += x.a));
          r.rec = rec;
          r.ob = d.ob;
          r.estado = "Recibida";
          save();
          toast("Recepción registrada. Stock aumentado con unidades aceptadas");
          render();
        },
      };

      /* APARIENCIA DE LA VISTA */
      const FUENTES = {
        Estándar: '"Segoe UI", system-ui, sans-serif',
        Verdana: "Verdana, Geneva, sans-serif",
        Georgia: 'Georgia, "Times New Roman", serif',
        Monoespaciada: 'Consolas, "Courier New", monospace',
      };
      const TAMS = [
        ["Pequeña", 13],
        ["Normal", 15],
        ["Grande", 17],
        ["Muy grande", 20],
      ];
      const TEMAS = [
        ["claro", "Claro"],
        ["oscuro", "Oscuro"],
        ["contraste", "Alto contraste"],
        ["calido", "Cálido"],
      ];
      const COLORES = [
        ["Verde azulado", "#0f766e"],
        ["Azul", "#1d4ed8"],
        ["Violeta", "#6d28d9"],
        ["Naranja", "#c2410c"],
        ["Rosa", "#be185d"],
      ];
      const CFG0 = { fs: 15, ff: "Estándar", tema: "claro", pri: "" };
      let CFG = { ...CFG0 };
      try {
        Object.assign(CFG, JSON.parse(localStorage.getItem("csv_cfg")));
      } catch (e) {}
      function applyCfg() {
        const h = document.documentElement;
        h.dataset.tema = CFG.tema;
        h.style.setProperty("--fs", CFG.fs + "px");
        h.style.setProperty("--ff", FUENTES[CFG.ff] || FUENTES["Estándar"]);
        if (CFG.pri) h.style.setProperty("--pri", CFG.pri);
        else h.style.removeProperty("--pri");
        try {
          localStorage.setItem("csv_cfg", JSON.stringify(CFG));
        } catch (e) {}
      }
      function setCfg(k, v) {
        CFG[k] = v;
        applyCfg();
        openCfg();
      }
      function resetCfg() {
        CFG = { ...CFG0 };
        applyCfg();
        openCfg();
      }
      function panel(html) {
        $("modal").innerHTML =
          `<div class="paper">${html}<p class="noprint" style="margin-top:14px;text-align:right"><button class="s" onclick="closeM()">Cerrar</button></p></div>`;
        $("modal").classList.add("on");
      }
      function openCfg() {
        const op = (k, v, txt) =>
          `<button class="sm ${CFG[k] == v ? "" : "s"}" onclick="setCfg('${k}',${typeof v == "number" ? v : `'${v}'`})">${txt}</button>`;
        panel(
          head("Apariencia de la vista") +
            `<p class="mut">Los cambios se aplican al instante y se guardan en este navegador.</p>
<p><b>Tamaño de letra</b><br>${TAMS.map((x) => op("fs", x[1], x[0])).join(" ")}</p>
<p><b>Tipo de letra</b><br>${Object.keys(FUENTES)
              .map((n) => op("ff", n, n))
              .join(" ")}</p>
<p><b>Tema</b><br>${TEMAS.map((x) => op("tema", x[0], x[1])).join(" ")}</p>
<p><b>Color principal</b><br>${COLORES.map((c) => `<button class="sw" title="${c[0]}" aria-label="${c[0]}" style="background:${c[1]};${CFG.pri == c[1] ? "outline:3px solid var(--ink);outline-offset:2px" : ""}" onclick="setCfg('pri','${c[1]}')"></button>`).join(" ")} ${op("pri", "", "Del tema")}</p>
<p><button class="s" onclick="resetCfg()">Restablecer apariencia</button></p>`,
        );
      }

      /* AYUDA TIPO MANUAL DE USUARIO */
      const norm = (s) =>
        String(s)
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");
      const ROLES = {
        Recepcionista: "Pacientes, Citas, Confirmar citas y Resultados externos.",
        Cajero: "Registrar pagos y Consultar medicamentos.",
        Enfermero: "Preconsulta.",
        Médico: "Atención, Historia clínica y Consultar medicamentos.",
        Farmacéutico:
          "Consultar medicamentos, Órdenes y entrega, Solicitar reposición y Registrar recepción.",
        Administrador: "Revisar reposiciones y Consultar medicamentos.",
      };
      const rolTxt = () =>
        U
          ? `Su rol es <b>${esc(U.t || U.r)}</b>. En el menú lateral tiene: ${ROLES[U.r]} Todos los roles ven además Inicio y la ventana teórica Requisitos y casos de uso.`
          : "Inicie sesión para ver las opciones de su rol. Hay seis roles: " +
            Object.keys(ROLES).join(", ") +
            ".";
      const AYUDA = [
        {
          t: "¿Qué puedo hacer con mi rol?",
          c: 1,
          k: ["mi rol", "que puedo", "permisos", "opciones", "menu", "modulos"],
          a: rolTxt,
        },
        {
          t: "Iniciar y cerrar sesión",
          c: 1,
          k: [
            "sesion",
            "login",
            "entrar",
            "ingresar",
            "usuario",
            "contrasena",
            "cuenta",
            "salir",
            "cerrar",
          ],
          a: "Ingrese usuario y contraseña, o pulse <b>Usar</b> junto a una cuenta de prueba para cargar los datos y luego <b>Iniciar sesión</b>. Para salir use <b>Cerrar sesión</b> en el menú lateral.",
        },
        {
          t: "Recorridos de demostración",
          c: 1,
          k: [
            "recorrido",
            "flujo",
            "empezar",
            "orden",
            "pasos",
            "demostracion",
            "demo",
            "proceso",
            "por donde",
          ],
          a: "<b>Atención:</b> Recepción registra paciente y cita → Cajero cobra → Recepción confirma → Enfermero registra preconsulta → Médico atiende (documento opcional).<br><b>Medicamentos:</b> Farmacéutico prepara la orden → Cajero cobra → Farmacéutico entrega.<br><b>Reposición:</b> Farmacéutico solicita → Administrador aprueba con proveedor → Farmacéutico registra la recepción.<br>En cada paso entre con la cuenta del rol que corresponde.",
        },
        {
          t: "Estados de citas, órdenes y reposiciones",
          k: ["estado", "estados", "significa", "etiqueta"],
          a: "<b>Citas:</b> Programada → Confirmada → Preconsulta → Atendida.<br><b>Órdenes:</b> Preparada → Pagada → Entregada.<br><b>Reposiciones:</b> Pendiente → Aprobada o Rechazada → Recibida.",
        },
        {
          t: "Cambiar letras y colores",
          c: 1,
          k: [
            "letra",
            "color",
            "tema",
            "oscuro",
            "tamano",
            "fuente",
            "apariencia",
            "vista",
            "contraste",
          ],
          a: "Pulse el botón <b>Apariencia</b> (abajo a la derecha). Puede elegir tamaño y tipo de letra, tema (claro, oscuro, alto contraste o cálido) y color principal. Se aplica al instante y se guarda en este navegador.",
        },
        {
          t: "Dónde se guardan los datos",
          k: ["dato", "guard", "navegador", "perder", "borrar", "reiniciar", "restablecer", "demo"],
          a: "Los datos se guardan en este navegador y se comparten entre todos los roles. Para borrar todo y volver a los datos iniciales use <b>Restablecer datos demo</b> en el menú lateral.",
        },
        {
          r: "Recepcionista",
          t: "Registrar y buscar pacientes",
          k: ["paciente", "registrar", "dni", "buscar", "editar", "actualizar"],
          a: "Menú <b>Pacientes</b>: complete DNI (8 dígitos, no repetido), nombre, fecha de nacimiento y teléfono, y pulse <b>Registrar</b>. Para buscar escriba el DNI o nombre; con <b>Editar</b> actualiza sus datos.",
        },
        {
          r: "Recepcionista",

      function msg(html, w) {
        const m = document.createElement("div");
        m.className = "mg " + w;
        m.innerHTML = html;
        $("bm").append(m);
        $("bm").scrollTop = 1e6;
      }
      function botSync() {
        const b = $("bot"),
          k = U ? U.r : "-";
        if (b.dataset.rol === k) return;
        b.dataset.rol = k;
        $("bm").innerHTML = "";
        msg(
          `Hola${U ? ", " + esc(U.n.split(" ")[0]) : ""}. Soy el asistente de ayuda: un manual interactivo con respuestas predefinidas (no es una IA). Escriba su pregunta o elija un tema.`,
          "b",
        );
        $("bc").innerHTML = AYUDA.map((e, i) => [e, i])
          .filter(([e]) => e.c || (U && e.r == U.r))
          .map(
            ([e, i]) => `<button type="button" class="sm s" onclick="ask('',${i})">${e.t}</button>`,
          )
          .join("");
      }
      function toggleBot() {
        $("bot").classList.toggle("on");
        if ($("bot").classList.contains("on")) $("bq").focus();
      }
      function ask(t, i) {
        const q = norm(t);
        let e = AYUDA[i],
          best = 0;
        if (e) t = e.t;
        else {
          if (!q.trim()) return;
          AYUDA.forEach((x) => {
            const s0 = x.k.reduce((n, w) => n + (q.includes(norm(w)) ? 1 : 0), 0),
              s = s0 ? s0 + (x.r && U && x.r == U.r ? 0.5 : 0) : 0;
            if (s > best) {
              best = s;
              e = x;
            }
          });
        }
        msg(esc(t), "u");
        if (!e)
          return msg(
            "No encontré una respuesta exacta. Pruebe con palabras como sesión, paciente, cita, pago, preconsulta, atención, receta, medicamentos, orden, reposición, recepción, estados o apariencia, o elija un tema de los botones.",
            "b",
          );
        const nota =
          e.r && U && U.r != e.r
            ? `<i>Esta tarea corresponde al rol ${e.r}; no aparece en el menú de su cuenta.</i><br>`
            : "";
        msg(nota + (typeof e.a == "function" ? e.a() : e.a), "b");
      }
      function askF(ev) {
        ev.preventDefault();
        const i = $("bq");
        ask(i.value);
        i.value = "";
      }
